<style>

.btns button.sug{outline:2px solid #f80}

const OPTS = [["crosswalk","횡단보도"],["roadway","차도"],["sidewalk","인도"],["unclear","판단 불가"],["exclude","제외"]];
const KEY = "t196_review_v1";
const st = JSON.parse(localStorage.getItem(KEY) || "{}");
function save(){localStorage.setItem(KEY, JSON.stringify(st)); count();}
function count(){const n = DATA.filter(d => st[d.file] && st[d.file].label).length; document.getElementById("cnt").textContent = n + " / " + DATA.length;}
function result(){return JSON.stringify(DATA.map(d => ({file: d.file, time: d.time, vlm: d.vlm, vlm_conf: d.conf,
  user: (st[d.file] || {}).label || null, memo: (st[d.file] || {}).memo || ""})), null, 1);}
function dl(){const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([result()], {type: "application/json"}));
  a.download = "t196_review_result.json"; a.click();}
function cp(){navigator.clipboard.writeText(result()).then(() => document.getElementById("msg").textContent = "복사됨",
  () => document.getElementById("msg").textContent = "복사 실패 — 내려받기를 쓰세요");}
const g = document.getElementById("g");
DATA.forEach((d, i) => {
  const s = st[d.file] = st[d.file] || {};
  const c = document.createElement("div"); c.className = "card";
  const low = d.conf < 0.7;
  c.innerHTML = `<div class="ph"><img src="${d.src}" alt="${d.file}"><div class="zone"></div></div>
    <div>${i + 1}. ${d.time} ${d.star ? "★ '차도입니다' 순간" : ""}<br><small>${d.file}</small></div>
    <div>VLM: <b>${d.vlm}</b> <span class="${low ? "low" : ""}">(확신 ${d.conf.toFixed(2)}${low ? " 낮음" : ""})</span></div>
    <div class="btns"></div><textarea placeholder="메모"></textarea>`;
  const b = c.querySelector(".btns"), ta = c.querySelector("textarea");
  function paint(){b.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === s.label)); c.classList.toggle("done", !!s.label);}
  OPTS.forEach(([v, t]) => {const x = document.createElement("button"); x.textContent = t; x.dataset.v = v;
    if (v === d.vlm) x.classList.add("sug");
    x.onclick = () => {s.label = s.label === v ? undefined : v; paint(); save();}; b.appendChild(x);});
  ta.value = s.memo || ""; ta.oninput = () => {s.memo = ta.value; save();};
  paint(); g.appendChild(c);
});
count();
</script></body></html>
